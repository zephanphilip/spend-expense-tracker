name: CI / CD

# Every push and PR is checked; pushes to main that pass are deployed to Firebase
# (Hosting + Firestore rules + indexes) at https://spend-9273d.web.app.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_PROJECT: spend-9273d

jobs:
  verify:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4 # Firestore emulator for the rules tests
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - run: npm run build # static export to out/, using the public config in .env.production
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7

  e2e:
    name: E2E (production build on the Hosting emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:e2e:prod # Playwright uses the runner's installed Google Chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  deploy:
    name: Deploy to Firebase
    needs: [verify, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://spend-9273d.web.app
    concurrency:
      group: firebase-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - name: Write service-account credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPEND_9273D }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT_SPEND_9273D repository secret (see README → Continuous deployment)."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: npx firebase deploy --only hosting,firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT" --non-interactive --message "GitHub Actions ${GITHUB_SHA::7}"
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
